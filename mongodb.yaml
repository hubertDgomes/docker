services:
  mongo:
    image: mongo
    ports:
      - "27027:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: hubert
      MONGO_INITDB_ROOT_PASSWORD: hubert

  mongo-express:
    image: mongo-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: "mongodb://hubert:hubert@mongo:27017/?authSource=admin"
